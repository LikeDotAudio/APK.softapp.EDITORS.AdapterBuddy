<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adapter & Media Balun Buddy</title>
  <link rel="stylesheet" href="./vendor/apk-contracts/apk-tokens.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .split-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      height: calc(100vh - 120px);
      padding: 16px;
      overflow: hidden;
    }
    .panel {
      background: var(--surface-primary, #18181b);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: var(--surface-secondary, #0f0f11);
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-bright, #f4f4f5);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .field-group {
      margin-bottom: 14px;
    }
    .field-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted, #888888);
      margin-bottom: 6px;
    }
    .field-group input, .field-group select {
      width: 100%;
      background: var(--surface-bg, #121212);
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 4px;
      color: var(--text-bright, #f4f4f5);
      padding: 8px 10px;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
    }
    .svg-viewport {
      background: var(--surface-bg, #121212);
      border-radius: 6px;
      border: 1px solid var(--border-color, #2c2c2c);
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .table-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color, #2c2c2c);
      border-radius: 6px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th {
      background: var(--surface-secondary, #0f0f11);
      color: var(--text-muted, #888888);
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      font-size: 11px;
      text-transform: uppercase;
    }
    table.data-table td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color, #2c2c2c);
      color: var(--text-bright, #f4f4f5);
    }
    .inline-cell {
      background: rgba(255, 255, 255, 0.02);
      cursor: text;
    }
    .inline-cell:focus {
      outline: 1px solid var(--accent-orange, #F4902C);
      background: rgba(244, 144, 44, 0.1);
    }
    .btn-delete {
      background: transparent;
      border: none;
      color: #FF5A5A;
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-delete:hover {
      background: rgba(255, 90, 90, 0.2);
    }
  </style>
</head>
<body class="deep-horizon">
  <div class="window-header">
    <div class="window-title">
      <span class="window-icon">🔌</span>
      <span class="window-text">Adapter & Media Balun Buddy</span>
      <span id="block-tag" class="block-tag">ADAPTER BLOCK</span>
    </div>
    <div class="window-actions">
      <button id="btn-open" class="btn-action">📂 Open Block</button>
      <button id="btn-discovered" class="btn-action">⚡ Discovered</button>
      <button id="btn-save" class="btn-action btn-primary">💾 Save & Return</button>
      <button id="btn-close" class="btn-action btn-close">✕</button>
    </div>
  </div>

  <div class="split-layout">
    <!-- Properties sidebar -->
    <div class="panel">
      <div class="panel-header">
        <span>Adapter Specifications</span>
      </div>
      <div class="panel-body">
        <div class="field-group">
          <label>Adapter / Balun Name</label>
          <input type="text" id="prop-name" value="HDMI-SDI-BALUN">
        </div>
        <div class="field-group">
          <label>Part Number</label>
          <input type="text" id="prop-partNumber" value="ADP-H2S-12G">
        </div>
        <div class="field-group">
          <label>Category</label>
          <select id="prop-category">
            <option value="Media Converter">Media Converter</option>
            <option value="Audio Balun">Audio Balun</option>
            <option value="Barrel Turnaround">Barrel Turnaround</option>
            <option value="Gender Changer">Gender Changer</option>
            <option value="Pin Translation">Pin Translation</option>
            <option value="Attenuator / Pad">Attenuator / Pad</option>
          </select>
        </div>
        <div class="field-group">
          <label>Circuit Architecture</label>
          <select id="prop-passiveOrActive">
            <option value="Active">Active (Powered / Re-clocking)</option>
            <option value="Passive">Passive (Transformer / Direct)</option>
          </select>
        </div>
        <div class="field-group">
          <label>Input Connector Format</label>
          <input type="text" id="prop-inFormat" value="HDMI 2.0">
        </div>
        <div class="field-group">
          <label>Output Connector Format</label>
          <input type="text" id="prop-outFormat" value="12G-SDI">
        </div>
        <div class="field-group">
          <label>Attenuation / Pad (dB)</label>
          <input type="number" id="prop-attenuationDb" value="0" step="0.5">
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="panel">
      <div class="panel-header">
        <span id="display-adapter-title">Schematic Translation & Wiring Map</span>
        <button id="btn-add-pin" class="btn-action btn-small">+ Add Pin Mapping</button>
      </div>
      <div class="panel-body" style="display: flex; flex-direction: column;">
        <div id="adapter-svg" class="svg-viewport"></div>
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width: 25%;">From Pin / Connector A</th>
                <th style="width: 25%;">To Pin / Connector B</th>
                <th style="width: 20%;">Signal Type</th>
                <th style="width: 20%;">Translation Status</th>
                <th style="width: 10%; text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="pins-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/adapterApp.js"></script>
</body>
</html>
